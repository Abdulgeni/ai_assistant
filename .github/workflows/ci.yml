name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    name: Guards (RTL + domain purity, authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the RTL guard
        run: bash tool/check_no_physical_directions.sh --self-test
      - name: RTL guard
        run: bash tool/check_no_physical_directions.sh lib
      - name: Domain purity guard (if present)
        run: |
          if [ -f tool/check_domain_purity.sh ]; then
            bash tool/check_domain_purity.sh --self-test
            bash tool/check_domain_purity.sh lib/domain
          else
            echo "domain purity guard not yet present; skipping."
          fi

  flutter:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Install SQLite for database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Generate code (Drift etc.)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate l10n
        if: ${{ hashFiles('lib/core/localization/arb/app_en.arb') != '' }}
        run: flutter gen-l10n
      - run: flutter analyze
      - name: Test
        if: ${{ hashFiles('test/**/*_test.dart') != '' }}
        run: flutter test
